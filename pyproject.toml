[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include=["spinnystar*"]

[tool.setuptools.package-data]
spinnystar = ["*.mplstyle"]

[project]
name = "spinnystar"
dynamic = ["version"]
description = "Stellar angular momentum evolution assuming solid-body rotation"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Elijah Blesch", email = "blesch@ung.edu"},
    {name = "Gregory Feiden", email = "gregory.feiden@ung.edu"}
]

keywords = ["astronomy", "astrophysics", "stellar astrophysics", "stellar evolution", 
    "stellar rotation", "gyrochronology"]

classifiers = [
    "Development Status :: Alpha",
    "Intended Audience :: Science / Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3"
]

dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools.dynamic]
version = {attr = "spinnystar.__version__"}

[project.urls]
Repository = "https://github.com/gafeiden/spinnystar"
Documentation = "https://spinnystar.readthedocs.io"
